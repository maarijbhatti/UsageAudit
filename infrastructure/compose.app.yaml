# Local application containers. Use together with compose.yaml.
# HTTPS termination and production secrets remain deployment responsibilities.
x-app-environment: &app-environment
  NODE_ENV: development
  HOST: 0.0.0.0
  PORT: 4000
  WEB_ORIGIN: http://localhost:3000
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-usageaudit}
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000

services:
  migrate:
    image: usageaudit-app:local
    env_file: ../.env
    environment: *app-environment
    command: ["node", "dist/apps/api/src/database/cli.js", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: usageaudit-app:local
    build:
      context: ..
      dockerfile: infrastructure/docker/App.Dockerfile
    env_file: ../.env
    environment: *app-environment
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          'fetch("http://127.0.0.1:4000/api/v1/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: usageaudit-app:local
    env_file: ../.env
    environment: *app-environment
    command: ["node", "dist/apps/worker/src/main.js"]
    depends_on:
      api:
        condition: service_healthy

  web:
    image: usageaudit-app:local
    environment:
      NODE_ENV: production
      API_ORIGIN: http://api:4000
    command:
      [
        "node",
        "apps/web/node_modules/next/dist/bin/next",
        "start",
        "apps/web",
        "-H",
        "0.0.0.0",
        "-p",
        "3000",
      ]
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          'fetch("http://127.0.0.1:3000/api/v1/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
